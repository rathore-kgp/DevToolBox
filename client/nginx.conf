# This replaces nginx's default site config inside the container.
# Vite builds a "single-page app" (SPA): one real index.html, and
# react-router-dom handles routes like /dashboard or /tools/jwt entirely
# in the browser with JavaScript. The problem: if someone hits
# yoursite.com/dashboard directly (a real HTTP request, e.g. on refresh),
# nginx would look for a literal file called "dashboard" on disk, not find
# one, and return a 404 — because it doesn't know about your client-side
# routes.
#
# try_files fixes this: try the exact file, then the exact path as a
# directory, and if neither exists, fall back to index.html so React
# Router gets to boot up and handle the route itself. This is exactly what
# your vercel.json's "rewrites" rule already does on Vercel — we're just
# recreating the same behavior for nginx.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
